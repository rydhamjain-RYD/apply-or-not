<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Fit Checker and Resume Customizer</title>
<style>
  :root{
    --bg:#f5f5f7;
    --card:#ffffff;
    --text:#1d1d1f;
    --muted:#6e6e73;
    --line:#d2d2d7;
    --blue:#0071e3;
    --blue-dark:#0066cc;
    --radius:20px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:17px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .tag{
    position:fixed;
    top:14px;
    right:16px;
    background:rgba(255,255,255,.8);
    -webkit-backdrop-filter:blur(12px);
    backdrop-filter:blur(12px);
    border:1px solid var(--line);
    color:var(--muted);
    font-size:13px;
    font-weight:600;
    padding:4px 12px;
    border-radius:999px;
    z-index:10;
  }
  main{
    max-width:760px;
    margin:0 auto;
    padding:72px 16px 64px;
  }
  header{text-align:center;margin-bottom:40px}
  h1{
    font-size:clamp(32px,8vw,48px);
    line-height:1.08;
    font-weight:700;
    letter-spacing:-.025em;
    margin:0 0 14px;
  }
  .tagline{
    font-size:clamp(17px,4.5vw,21px);
    color:var(--muted);
    margin:0 auto;
    max-width:560px;
  }
  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:24px;
    margin-bottom:20px;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 24px rgba(0,0,0,.04);
  }
  .step-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .num{
    flex:none;
    width:30px;height:30px;
    border-radius:50%;
    background:var(--blue);
    color:#fff;
    font-weight:600;
    font-size:15px;
    display:flex;align-items:center;justify-content:center;
  }
  h2{font-size:22px;font-weight:600;letter-spacing:-.015em;margin:0}
  .hint{color:var(--muted);font-size:15px;margin:0 0 14px 42px}
  textarea{
    width:100%;
    min-height:220px;
    resize:vertical;
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    font:inherit;
    font-size:16px;
    color:var(--text);
    background:#fbfbfd;
    outline:none;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  textarea:focus{
    border-color:var(--blue);
    background:#fff;
    box-shadow:0 0 0 4px rgba(0,113,227,.15);
  }
  textarea::placeholder{color:#a1a1a6}
  .action{text-align:center;margin-top:28px}
  .primary{
    appearance:none;
    border:0;
    background:var(--blue);
    color:#fff;
    font:inherit;
    font-size:18px;
    font-weight:600;
    padding:15px 36px;
    border-radius:999px;
    cursor:pointer;
    width:100%;
    max-width:360px;
    transition:background .15s, transform .1s;
  }
  .primary:hover{background:var(--blue-dark)}
  .primary:active{transform:scale(.98)}
  .soon{
    margin-top:14px;
    min-height:24px;
    color:var(--muted);
    font-size:15px;
  }
  @media (max-width:480px){
    main{padding-top:64px}
    .card{padding:18px}
    .hint{margin-left:0}
  }
</style>
</head>
<body>
<div class="tag">v0.1</div>
<main>
  <header>
    <h1>Job Fit Checker &amp; Resume Customizer</h1>
    <p class="tagline">Checks the job description against your resume, then customizes it so your ATS score goes up.</p>
  </header>

  <section class="card">
    <div class="step-head"><span class="num">1</span><h2>Your CV</h2></div>
    <p class="hint">Paste the full text of your CV.</p>
    <textarea id="cv" placeholder="Paste your CV here…"></textarea>
  </section>

  <section class="card">
    <div class="step-head"><span class="num">2</span><h2>The job post</h2></div>
    <p class="hint">Paste the job description you are considering.</p>
    <textarea id="job" placeholder="Paste the job post here…"></textarea>
  </section>

  <div class="action">
    <button class="primary" id="check" type="button">Check my fit</button>
    <div class="soon" id="soon" aria-live="polite"></div>
  </div>
</main>
<script>
  document.getElementById('check').addEventListener('click', function(){
    document.getElementById('soon').textContent = 'Coming soon';
  });
</script>
</body>
</html>
